<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GemmaHausa - English to Natural Hausa AI Translator</title>
    <meta name="description" content="Natural English-to-Hausa translation powered by Gemma 4 with cultural context, regional variants, and dual API/Ollama support." />
    <meta property="og:title" content="GemmaHausa - English to Natural Hausa AI Translator" />
    <meta property="og:description" content="Natural English-to-Hausa translation powered by Gemma 4 with cultural context, regional variants, and dual API/Ollama support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress WebSocket and HMR connection errors in AI Studio iframe environment
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        var file = (event && event.filename) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          file.indexOf('@vite/client') !== -1
        ) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = (event && event.reason) || '';
        var str = String(reason.message || reason);
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
